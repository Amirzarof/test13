<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گیمینگ لندینگ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,0,0,0.03) 0px, rgba(255,0,0,0.03) 1px, transparent 1px, transparent 2px),
                repeating-linear-gradient(90deg, rgba(255,0,0,0.03) 0px, rgba(255,0,0,0.03) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border: 8px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.1);
            animation: flicker 0.3s infinite;
        }

        @keyframes flicker {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.1);
            }
            50% {
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.05);
            }
        }

        h1 {
            font-size: 4em;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #ff00ff, 2px 2px 0px #ff00ff;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                text-shadow: 0 0 10px #00ff00, 0 0 20px #ff00ff;
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 20px #00ff00, 0 0 40px #ff00ff, 0 0 60px #00ffff;
                transform: scale(1.05);
            }
        }

        .subtitle {
            font-size: 1.5em;
            color: #00ffff;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-2px);
            }
            40% {
                transform: translateX(2px);
            }
            60% {
                transform: translateX(-2px);
            }
            80% {
                transform: translateX(2px);
            }
            100% {
                transform: translateX(0);
            }
        }

        .description {
            font-size: 1.2em;
            color: #ffff00;
            margin-bottom: 40px;
            line-height: 1.8;
            text-shadow: 0 0 5px #ffff00;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: 4px solid;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .btn-primary {
            background: #ff0080;
            color: #fff;
            border-color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
        }

        .btn-primary:hover {
            background: #ff33a0;
            box-shadow: 0 0 20px #ff0080, 0 0 0 4px rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .btn-secondary {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .btn-secondary:hover {
            background: #33ff33;
            box-shadow: 0 0 20px #00ff00, 0 0 0 4px rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .pixel-art {
            margin: 40px 0;
            font-size: 2em;
            animation: bounce 0.6s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .stars {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            z-index: 0;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .feature-box {
            background: linear-gradient(135deg, #ff006e 0%, #00d4ff 100%);
            border: 4px solid #ffbe0b;
            padding: 20px;
            margin: 20px 0;
            font-size: 1.1em;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 190, 11, 0.6);
        }

        .feature-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 190, 11, 0.9);
        }
    </style>
</head>
<body>
    <div class="pixel-bg"></div>
    
    <div class="container">
        <div class="pixel-art">🎮 8️⃣👾</div>
        
        <h1>خوش آمدید</h1>
        <p class="subtitle">به دنیای گیمینگ!</p>
        
        <p class="description">
            یک سایت گیمینگ شگفت‌انگیز و پر رنگ برای شما!
        </p>
        
        <div class="feature-box">
            🎯 بازی‌های هیجان‌انگیز
        </div>
        
        <div class="feature-box">
            🏆 رقابت و جوایز
        </div>
        
        <div class="feature-box">
            🌈 گرافیکس پیکسلی شگفت‌انگیز
        </div>
        
        <div class="button-container">
            <button class="btn btn-primary" onclick="startGame()">شروع بازی</button>
            <button class="btn btn-secondary" onclick="learnMore()">بیشتر بدانید</button>
        </div>
    </div>

    <script>
        // ایجاد ستاره‌های تمام‌کننده
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'stars';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(star);
            }
        }
        
        createStars();
        
        function startGame() {
            alert('🎮 بازی شروع شد!');
        }
        
        function learnMore() {
            alert('ℹ️ برای کسب اطلاعات بیشتر، دوباره بیایید!');
        }
    </script>
</body>
</html>
